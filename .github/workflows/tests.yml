name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Alle Jobs auf ubuntu-24.04 statt ubuntu-latest: GitHub hat latest auf 26.04
# weitergedreht, und Playwright 1.56.1 installiert dort keinen Chromium
# ("Playwright does not support chromium on ubuntu26.04-x64") - die
# Browser-Tests brachen nach elf Sekunden ab, vor dem ersten Test. Wer das
# Image hochzieht, zieht Playwright mit.
jobs:
  browser-tests:
    name: Browser-Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      # Zuerst: ein kaputtes Workflow-YAML scheitert vor jedem Job und erzeugt
      # keine Check-Runs - das sieht aus wie "noch nicht gestartet".
      - name: Workflow-Struktur
        run: node tests/workflow.test.mjs

      - name: UI-Tests (Version, Aufbau, Kapitelstatus, Messwerte)
        run: node tests/ui.test.mjs

      - name: Fehlerprotokoll
        run: node tests/errorlog.test.mjs

      - name: GitHub-Zugang (Token pruefen, verbinden)
        run: node tests/github-zugang.test.mjs

  # Wer eine ausgelieferte Datei aendert, zaehlt die Version hoch. Sonst gehen
  # zwei verschiedene Staende unter derselben Nummer raus - genau so ist v13
  # zweimal passiert, zwoelf Minuten auseinander, beide mit Cache jerico-v13.
  # Braucht die Historie, deshalb fetch-depth: 0. Eigener Job, weil er keinen
  # Browser braucht und damit auch dann noch etwas sagt, wenn die Browser-
  # Tests an der Installation scheitern.
  versionsdisziplin:
    name: Versionsdisziplin
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Version passt zum ausgelieferten Stand
        run: node tests/release-guard.test.mjs

  # Prueft die tatsaechlich ausgelieferte Seite. Laeuft nur auf main und
  # blockiert nichts, weil ein Aussetzer bei GitHub Pages oder der GitHub-API
  # nichts ueber den Code aussagt.
  smoke-live:
    name: Smoke-Test gegen die Live-Seite
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    needs: browser-tests

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Live-Seite pruefen
        run: node tests/smoke-live.mjs
